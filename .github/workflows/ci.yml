name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU pre-built wheels for llama-cpp-python in CI to prevent compilation failures and speed up build
        pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --prefer-binary llama-cpp-python
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run tests
      run: |
        pytest test_staging_api.py test_image_endpoints.py -v
