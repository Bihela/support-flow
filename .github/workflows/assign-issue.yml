name: Auto Issue Assigner

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    steps:
    - name: Assign commenter to issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const commentBody = context.payload.comment.body.toLowerCase().trim();
          if (commentBody.includes('/assign') || commentBody.includes('.take')) {
            const issue = context.issue;
            const commenter = context.payload.comment.user.login;

            // Get current issue details to check assignees
            const issueData = await github.rest.issues.get({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number
            });

            if (issueData.data.assignees && issueData.data.assignees.length > 0) {
              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `Hello @${commenter}! This issue is already assigned to @${issueData.data.assignees[0].login}. Feel free to check out other open issues!`
              });
            } else {
              await github.rest.issues.addAssignees({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                assignees: [commenter]
              });

              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `Hi @${commenter}! You have been successfully assigned to this issue. Thank you for contributing! 🎉`
              });
            }
          }
